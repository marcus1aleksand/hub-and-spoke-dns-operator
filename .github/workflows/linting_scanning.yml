name: Lint and Security Scan

on:
  pull_request:
    branches:
      - main
    types: 
      - opened
      - synchronize 
      - reopened

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.5.0

      - name: Run flake8 (Python Linting)
        run: |
          flake8 ./operator/ --max-line-length=120


  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/v3.19.0/scripts/get-helm-3 | bash

      - name: Run helm lint
        working-directory: charts
        run: |
          helm lint .
    
  scan-python:
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4

      - name: Run bandit (Security Scan)
        run: |
          bandit -r ./operator/ -x './operator/test_*.py' -f screen

  scan-helm:
    runs-on: ubuntu-latest
    needs: lint-helm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: checkov.yaml
